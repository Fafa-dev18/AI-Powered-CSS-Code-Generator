<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>GERADOR CSS</title>
  </head>

  <body>
    <h1>Gerador de CSS <span>com IA✨</span></h1>
    <p class="subtitulo">Gere suas ideias com um clique de mágica</p>

    <div class="input-container">
      <textarea
        rows="3"
        placeholder="Ex: bolinha azul quicando na tela"
        class="caixa-texto"
      ></textarea>

      <button class="botao-gerar">Gerar ideia ✨</button>
    </div>

    <div class="workspace-grid">
      <div class="card">
        <h2>🛠️ Código Retornado</h2>
        <p class="bloco-codigo">O código gerado aparecerá aqui...</p>
      </div>

      <div class="card">
        <h2>👁️ Preview em Tempo Real</h2>
        <iframe class="resultado-codigo"></iframe>
      </div>
    </div>
  </body>
  <script src="config.js"></script>
  <script src="scripts.js"></script>
</html>
